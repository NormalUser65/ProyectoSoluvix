<section class="home-hero">
  <div class="hero-actions">
    <button
      mat-flat-button
      type="button"
      class="hero-action service-action"
      [routerLink]="'/servicios'"
    >
      <mat-icon>search</mat-icon>
      <span>Buscar un servicio</span>
    </button>

    <button
      mat-flat-button
      type="button"
      class="hero-action professional-action"
      [routerLink]="'/admin/profesionales/create'"
    >
      <mat-icon>photo_camera</mat-icon>
      <span>Convertirse en profesional</span>
    </button>

    <button
      mat-stroked-button
      type="button"
      class="hero-action login-action"
      [routerLink]="'/login'"
    >
      <mat-icon>login</mat-icon>
      <span>Iniciar sesión</span>
    </button>
  </div>

  <div class="photographer-container">
    <div class="decorative-circle circle-one"></div>
    <div class="decorative-circle circle-two"></div>
    <img
      class="photographer-image"
      src="http://localhost:3000/images/Fotografo-Home.png"
      alt="Fotógrafo profesional sosteniendo una cámara"
    />
  </div>

  <div class="hero-content">
    <span class="eyebrow">Servicios profesionales de fotografía</span>
    <h1>Captura tus momentos</h1>
    <p>
      Conecta con profesionales de la fotografía,
      explora sus servicios y agenda una cita de
      acuerdo a lo que necesites.
    </p>

    <div class="hero-highlight">
      <span class="highlight-line"></span>
      <div>
        <strong>Soluciones visuales a tu alcance</strong>
        <small>Profesionales, servicios y citas en un solo lugar.</small>
      </div>
    </div>
  </div>
</section>
