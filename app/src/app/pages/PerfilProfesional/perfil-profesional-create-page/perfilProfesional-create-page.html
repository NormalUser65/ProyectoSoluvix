<section class="page-container">
  <header class="page-header">
    <h1>Registrar perfil profesional</h1>
    <p>Agregue un nuevo profesional al catálogo de servicios.</p>
  </header>

  @if (loading()) {
    <p>Cargando datos del formulario...</p>
  } @else {
    @if (error()) {
      <p class="error-message">
        {{ error() }}
      </p>
    }

    <app-perfil-profesional-form
      [usuarios]="usuarios()" 
      [modalidades]="modalidades()"
      [especialidades]="especialidades()"
      [saving]="saving()"
      (guardar)="guardar($event)"
      (cancelar)="cancelar()"
    />
  }
</section>
